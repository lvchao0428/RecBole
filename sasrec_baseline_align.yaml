---
# SASRec baseline that keeps pure ID scoring but adds InfoNCE alignment regularization.
# Text embeddings are loaded for alignment only; fusion into item embeddings is disabled via
# fuse_text_feature: false so that the recommendation head matches the vanilla SASRec behavior.

model: SASRec_Align

# Dataset
dataset: Amazon_Beauty
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# Training / Evaluation
epochs: 200
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'uni100','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]
metrics: [Recall, MRR, NDCG, Hit, Precision]
valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# Model parameters
hidden_size: 256

# Text / alignment controls
disable_text_feature: false
fuse_text_feature: false
use_llm: false
use_cross: false
use_align: true
alignment_weight: 0.1
temperature: 0.07
item_text_emb_path_base: dataset/Amazon_Beauty/item_text_emb.base.npy
normalize_text: true
detach_text_emb: true
text_mlp_bn: false
text_proj_norm: true
fused_item_norm: true

# Gating / regularization
text_weight: 1.0
text_gate_init: 0.5
text_gate_reg_l2: 0.0
text_gate_reg_entropy: 0.0

# Optional knobs for reproducibility
token_dropout_prob: 0.0
cosine_score: false
cosine_scale: 10.0

