---
# SASRecAlignMultiViewV3 baseline (Pure ID, no text features)
# 用于验证 MultiViewV3 模型在禁用文本特征后能还原 run50epBase_stratified 的效果
# 
# 验证目的：确保 V3 架构的改动不影响纯 ID 基准性能

model: SASRecAlignMultiViewV3
hidden_size: 256
n_layers: 2
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
gpu_id: "0"

# Dataset
dataset: Amazon_Beauty
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# Training / Evaluation (40 epochs, no phaseA)
epochs: 40
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

# 评估指标：标准指标 + 分档指标
metrics: [
  Recall, MRR, NDCG, Hit, Precision,
  StratifiedRecall, StratifiedNDCG, StratifiedMRR, StratifiedHit,
  ItemPopularityStats
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# ============ V3 权重配置 (全部禁用) ============
align_weight: 0.0           # 禁用对齐损失
cold_text_boost: 0.0        # 禁用冷启动训练增强
infer_boost: 0.0            # 禁用推理增强
cold_threshold: 10          # 冷启动阈值
# ===============================================

# Multi-View 配置 (全部禁用)
use_text_view_split: false  # 禁用多视图
use_multiview_text_cross: false
item_text_emb_split_dir: ""
item_text_emb_path_base: ""
item_text_emb_path_llm: ""

# Pure ID baseline (Text/Alignment DISABLED)
use_llm: false
use_align: false
use_cross: false
text_cross_layer_num: 0
temperature: 0.07
detach_text_emb: true
normalize_text: true

# Multi-View 特有配置 (无效因为 use_text_view_split=false)
text_view_senet_ratio: 2
per_view_l2_norm: true
use_text_view_senet: true
text_view_half_precision: true

# Regularization & scoring
weight_decay: 1e-5
label_smoothing: 0.1
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
token_dropout_prob: 0.2
cosine_score: false
cosine_scale: 10.0

# Text fusion stabilizers (disabled for baseline)
text_proj_norm: false
fused_item_norm: false
text_weight: 0.0
text_gate_init: 0.0
text_mlp_bn: false
freeze_backbone: false

# Switches (text disabled)
disable_text_feature: true
fuse_text_feature: false
cross_dropout_prob: 0.0
