---
# SASRec with TF-IDF + LLM (Qwen3) + Stratified Evaluation
# 继承 sasrec_align_qwen3.yaml，添加分档评估指标

model: SASRecAlign

# Model parameters - unified to 256
hidden_size: 256
n_layers: 2
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
gpu_id: "6"

# Dataset
dataset: Amazon_Beauty
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# Training / Evaluation
epochs: 50
train_batch_size: 512 
eval_batch_size: 512 
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

# 评估指标：标准指标 + 分档指标
metrics: [
  Recall, MRR, NDCG, Hit, Precision,           # 标准指标
  StratifiedRecall, StratifiedNDCG, StratifiedMRR, StratifiedHit,  # 分档指标
  ItemPopularityStats                            # Item 分布统计
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# Text features (TF-IDF + Qwen3) with SENet and Gates
#item_text_emb_path_base: /home/ubuntu/own/RecBole/dataset/Amazon_Beauty/item_text_emb.base.npy
item_text_emb_path_base: /home/charlie/project/RecBole/dataset/Amazon_Beauty/item_text_emb.base.npy
#item_text_emb_path_llm: /home/ubuntu/own/RecBole/dataset/Amazon_Beauty/item_text_emb.qwen3.base.npy
#item_text_emb_path_llm: /home/charlie/project/RecBole/dataset/Amazon_Beauty/item_text_emb.qwen3.base.npy
item_text_emb_path_llm: /home/charlie/project/RecBole/dataset/Amazon_Beauty/item_text_emb.qwen2.5_14b.base.npy
use_llm: true
use_align: true
use_cross: true
text_cross_layer_num: 1
alignment_weight: 0.05
temperature: 0.07
detach_text_emb: true
normalize_text: true
use_fusion: false

# Fair comparison with Multi-View: Enable SENet and Gates
text_use_senet: true    # Enable SENet enhancement for LLM features
num_text_views: 1       # Single LLM view (vs 4 views in Multi-View)

# Regularization & scoring
weight_decay: 1e-5
label_smoothing: 0.1
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
token_dropout_prob: 0.2
cosine_score: true
cosine_scale: 10.0

# Text fusion stabilizers
text_proj_norm: true
fused_item_norm: true
text_weight: 0.8
text_tail_threshold: 0
use_seq_text_cross: false
seq_text_cross_dropout: 0.1

# New switches (neutral defaults)
disable_text_feature: false
fuse_text_feature: true
cross_dropout_prob: 0.5
text_gate_init: 0.5
text_gate_reg_l2: 0.05
text_gate_reg_entropy: 0.0
text_mlp_bn: false
freeze_backbone: false
align_exclude_topk: 0

# ========== 冷启动对齐权重增强 ==========
# 问题: 对齐损失被高频商品主导，冷启动商品的对齐信号弱
# 解决: 给低频商品更高的对齐损失权重
# 权重公式: weight = 1.0 + boost * max(0, threshold - popularity) / threshold
# - cold_start_align_boost: 增强系数 (0=关闭，建议2.0-5.0)
# - cold_start_align_threshold: 低于此popularity的商品获得额外权重
cold_start_align_boost: 3.0       # 冷启动商品最高获得 1+3=4倍 对齐权重
cold_start_align_threshold: 10    # popularity < 10 的商品获得额外权重
# ================================

