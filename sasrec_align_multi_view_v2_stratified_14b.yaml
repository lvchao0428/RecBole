---
# SASRec Multi-View V2 + Stratified Evaluation
# 增强版Multi-View模型配置
#
# 改动点（相比 sasrec_align_multi_view_stratified.yaml）：
# 1. model: SASRecAlignMultiViewV2 (使用V2版本)
# 2. multiview_align_scale: 2.0 (Multi-View专属对齐损失放大)
# 3. text_view_senet_ratio: 2 (SENet压缩比从4降到2)
# 4. per_view_l2_norm: true (每个view独立L2归一化)

model: SASRecAlignMultiViewV2
hidden_size: 256
fusion_chunk_size: 16384  # Reduced from 65536 to prevent CUDA timeout
n_layers: 2
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
gpu_id: "0"


# Dataset / data loader
dataset: Amazon_Beauty
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# Training / Evaluation
epochs: 50
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

# 评估指标：标准指标 + 分档指标
metrics: [
  Recall, MRR, NDCG, Hit, Precision,           # 标准指标
  StratifiedRecall, StratifiedNDCG, StratifiedMRR, StratifiedHit,  # 分档指标
  ItemPopularityStats                            # Item 分布统计
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# Text feature sources (TF-IDF base + 4-view Qwen3 split embeddings)
# /home/ubuntu/own/RecBole/dataset/Amazon_Beauty
#item_text_emb_path_base: /home/charlie/project/RecBole/dataset/Amazon_Beauty/item_text_emb.base.npy
item_text_emb_path_base: /home/charlie/project/RecBole/dataset/Amazon_Beauty/item_text_emb.base.center_only.npy
#item_text_emb_path_base: /home/ubuntu/own/RecBole/dataset/Amazon_Beauty/item_text_emb.base.npy
#item_text_emb_path_base: /home/ubuntu/own/RecBole/dataset/Amazon_Beauty/item_text_emb.base.center_only.npy
item_text_emb_path_llm: ""
  #item_text_emb_split_dir: /home/charlie/project/RecBole/dataset/Amazon_Beauty/qwen2.5_14b_4views
item_text_emb_split_dir: /home/charlie/project/RecBole/dataset/Amazon_Beauty/qwen2.5_14b_4views_center_only
#item_text_emb_split_dir: /home/ubuntu/own/RecBole/dataset/Amazon_Beauty/qwen2.5_14b_4views
#item_text_emb_split_dir: /home/ubuntu/own/RecBole/dataset/Amazon_Beauty/qwen2.5_7b_4views_center_only
use_llm: false
use_align: true
use_cross: true
text_cross_layer_num: 1  # Reduced from 2 to prevent CUDA timeout with multiview_text_cross
use_seq_text_cross: false
use_text_view_split: true
use_multiview_text_cross: true  # Required for multi-view fusion
num_text_views: 4

# ========== V2 新增配置 ==========
# [CHANGE-3] Multi-View专属对齐损失放大系数
# 原先4个view的对齐信号被稀释，现在放大2倍增强multi-view学习
multiview_align_scale: 1.0

# [CHANGE-4] SENet压缩比从4降到2，保留更多multi-view信息
# 原先: hidden_size/4 = 64维压缩
# 现在: hidden_size/2 = 128维压缩
text_view_senet_ratio: 2

# [CHANGE-5] 每个view独立L2归一化
per_view_l2_norm: true

# [CHANGE-6] 冷启动对齐权重增强
# 问题: 对齐损失被高频商品主导，冷启动商品的对齐信号弱
# 解决: 给低频商品更高的对齐损失权重
# 权重公式: weight = 1.0 + boost * max(0, threshold - popularity) / threshold
# - cold_start_align_boost: 增强系数 (0=关闭，建议2.0-5.0)
# - cold_start_align_threshold: 低于此popularity的商品获得额外权重
cold_start_align_boost: 0       # 冷启动商品最高获得 1+3=4倍 对齐权重
cold_start_align_threshold: 10    # popularity < 10 的商品获得额外权重
# ================================

text_view_half_precision: true

# Alignment and gating
alignment_weight: 0.05
temperature: 0.07
detach_text_emb: true
normalize_text: true
text_weight: 1.0
text_tail_threshold: 0
text_gate_init: 0.7
text_gate_reg_l2: 0.05
text_gate_reg_entropy: 0.0

# Regularization & scoring
weight_decay: 1e-5
label_smoothing: 0.1
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
token_dropout_prob: 0.2
cross_dropout_prob: 0.2
cosine_score: true
cosine_scale: 10.0

# Stabilizers
text_proj_norm: true
fused_item_norm: true
disable_text_feature: false
text_mlp_bn: false
freeze_backbone: false
align_exclude_topk: 0
fuse_text_feature: true
use_fusion: false
