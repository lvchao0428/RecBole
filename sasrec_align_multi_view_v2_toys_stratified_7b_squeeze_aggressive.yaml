---
# SASRec Multi-View V2 + Stratified Evaluation (Amazon_Toys_and_Games Dataset)
# ============================================================
# 激进压榨版配置
# 
# 目标: 最大化 text 特征学习，验证上限
# 方案: 更强对齐 + 更紧 InfoNCE + 更长训练
# 
# 与 squeeze.yaml 的区别:
# - alignment_weight: 0.15 (更强对齐)
# - temperature: 0.03 (更紧的 InfoNCE)
# - multiview_align_scale: 2.0 (开启对齐放大)
# - epochs: 60 (更长训练)
# ============================================================

model: SASRecAlignMultiViewV2
hidden_size: 256
fusion_chunk_size: 16384
n_layers: 2
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
gpu_id: "2"

# Dataset (Amazon_Toys_and_Games specific)
dataset: Amazon_Toys_and_Games
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id, title, categories]

# Training / Evaluation (更长训练)
epochs: 60
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 25
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

# 评估指标：标准指标 + 分档指标
metrics: [
  Recall, MRR, NDCG, Hit, Precision,
  StratifiedRecall, StratifiedNDCG, StratifiedMRR, StratifiedHit,
  ItemPopularityStats
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# Text feature sources (with whiten)
item_text_emb_path_base: dataset/Amazon_Toys_and_Games/item_text_emb.base.npy
item_text_emb_path_llm: ""
item_text_emb_split_dir: dataset/Amazon_Toys_and_Games/qwen2.5_7b_4views
use_llm: false
use_align: true
use_cross: true
text_cross_layer_num: 1
use_seq_text_cross: false
use_text_view_split: true
use_multiview_text_cross: true
num_text_views: 4

# ========== V2 激进配置 ==========
# [AGGRESSIVE-1] 开启对齐放大
multiview_align_scale: 2.0

text_view_senet_ratio: 2
per_view_l2_norm: true

# 冷启动加强
cold_start_align_boost: 3.0
cold_start_align_threshold: 10
use_ipw_weighting: false
# ================================

text_view_half_precision: true

# ========== 激进对齐参数 ==========
# [AGGRESSIVE-2] 更强对齐
alignment_weight: 0.15

# [AGGRESSIVE-3] 更紧的 InfoNCE
temperature: 0.03

# [AGGRESSIVE-4] 保持适中的 text_weight
text_weight: 0.6

detach_text_emb: true
normalize_text: true
text_tail_threshold: 0
text_gate_init: 0.7
text_gate_reg_l2: 0.05
text_gate_reg_entropy: 0.0

# Regularization & scoring
weight_decay: 1e-5
label_smoothing: 0.1
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
token_dropout_prob: 0.2
cross_dropout_prob: 0.1          # 更小的 dropout，更稳定
cosine_score: true
cosine_scale: 12.0               # 略高的 cosine scale

# Stabilizers
text_proj_norm: true
fused_item_norm: true
disable_text_feature: false
text_mlp_bn: false
freeze_backbone: false
align_exclude_topk: 0
fuse_text_feature: true
use_fusion: false
