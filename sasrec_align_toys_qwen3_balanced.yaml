---
# SASRec with TF-IDF + LLM (Single-View) + Balanced Configuration (Toys Dataset)
# 与 Multi-View V2 Balanced 公平对比的配置
#
# Balanced 参数:
# - alignment_weight: 0.07
# - temperature: 0.05
# - text_weight: 0.8
# - cold_start_align_boost: 2.0

model: SASRecAlign
hidden_size: 256
n_layers: 2
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
gpu_id: "1"

# Dataset - Toys
dataset: Amazon_Toys_and_Games
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id, title, categories]

# Training / Evaluation
epochs: 50
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

metrics: [
  Recall, MRR, NDCG, Hit, Precision,
  StratifiedRecall, StratifiedNDCG, StratifiedMRR, StratifiedHit,
  ItemPopularityStats
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# Text features (TF-IDF + LLM Single-View)
item_text_emb_path_base: dataset/Amazon_Toys_and_Games/item_text_emb.base.npy
item_text_emb_path_llm: dataset/Amazon_Toys_and_Games/item_text_emb.qwen2.5_7b.base.npy
use_llm: true
use_align: true
use_cross: true
text_cross_layer_num: 1

# ========== Balanced 核心参数 ==========
alignment_weight: 0.07
temperature: 0.05
text_weight: 0.8
cold_start_align_boost: 2.0
cold_start_align_threshold: 10
cross_dropout_prob: 0.15
# =====================================

detach_text_emb: true
normalize_text: true
use_fusion: false

# Fair comparison with Multi-View
text_use_senet: true
num_text_views: 1

# Regularization & scoring
weight_decay: 1e-5
label_smoothing: 0.1
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
token_dropout_prob: 0.2
cosine_score: true
cosine_scale: 10.0

# Text fusion stabilizers
text_proj_norm: true
fused_item_norm: true
text_tail_threshold: 0
use_seq_text_cross: false
seq_text_cross_dropout: 0.2

# Switches
disable_text_feature: false
fuse_text_feature: true
text_gate_init: 0.7
text_gate_reg_l2: 0.05
text_gate_reg_entropy: 0.0
text_mlp_bn: false
freeze_backbone: false
align_exclude_topk: 0
