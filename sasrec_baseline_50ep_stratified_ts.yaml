---
# Pure SASRec baseline (50 epochs) + Stratified Evaluation
# Global Time-based Split (TS) — 验证 GTS 下结论是否与 LOO 一致

model: SASRecAlign
hidden_size: 256
n_layers: 2
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
gpu_id: "0"

# Dataset
dataset: Amazon_Beauty
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# Training / Evaluation
epochs: 50
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'TS': [0.8, 0.1, 0.1]}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

metrics: [
  Recall, MRR, NDCG, Hit, Precision,
  StratifiedRecall, StratifiedNDCG, StratifiedMRR, StratifiedHit,
  ItemPopularityStats
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# Pure SASRec baseline (Text/Alignment DISABLED)
item_text_emb_path_base: ""
use_llm: false
use_align: false
use_cross: false
text_cross_layer_num: 0
alignment_weight: 0.0
temperature: 0.07
detach_text_emb: true
normalize_text: true
use_fusion: false

# Regularization & scoring
weight_decay: 1e-5
label_smoothing: 0.1
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
token_dropout_prob: 0.2
cosine_score: false
cosine_scale: 10.0

# Text fusion stabilizers (disabled for baseline)
text_proj_norm: false
fused_item_norm: false
text_weight: 0.0
text_tail_threshold: 0
use_seq_text_cross: false
seq_text_cross_dropout: 0.0

# Switches (text disabled)
disable_text_feature: true
fuse_text_feature: false
cross_dropout_prob: 0.0
text_gate_init: 0.0
text_gate_reg_l2: 0.0
text_gate_reg_entropy: 0.0
text_mlp_bn: false
freeze_backbone: false
align_exclude_topk: 0
