---
# SASRec with TF-IDF baseline + Stratified Evaluation
# 继承 sasrec_align_base.yaml，添加分档评估指标

model: SASRecAlignV3
hidden_size: 256
n_layers: 2
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
gpu_id: "0"

# Dataset
dataset: Amazon_Beauty
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# Training / Evaluation
epochs: 50
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

# 评估指标：标准指标 + 分档指标
metrics: [
  MRR, NDCG, Hit,
  StratifiedNDCG, StratifiedMRR, StratifiedHit
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# ============ V3 简化权重配置 ============
# 三个核心权重控制参数：
align_weight: 0.1           # 全局对齐权重（影响训练对齐损失强度）
cold_text_boost: 0.0        # 冷启动训练增强（0=关闭，建议2.0-5.0，给低频商品更高对齐权重）
infer_boost: 0.0            # 推理增强（0=关闭，建议0.5-2.0，推理时给低频商品更强文本信号）
cold_threshold: 10          # 冷启动阈值（低于此 popularity 的商品获得增强）
# =========================================

# Text features (TF-IDF + LLM)
item_text_emb_path_base: /home/charlie/project/RecBole/dataset/Amazon_Beauty/item_text_emb.base.npy
item_text_emb_path_llm: ""
use_llm: false
use_align: true
use_cross: true
text_cross_layer_num: 1
temperature: 0.05
detach_text_emb: true
normalize_text: true

# Regularization & scoring
weight_decay: 1e-5
label_smoothing: 0.1
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
token_dropout_prob: 0.2
cosine_score: true
cosine_scale: 10.0

# Text fusion settings
text_proj_norm: true
fused_item_norm: true
text_weight: 1.0
text_gate_init: 0.7
cross_dropout_prob: 0.2
text_mlp_bn: false
freeze_backbone: false
disable_text_feature: false
fuse_text_feature: true
