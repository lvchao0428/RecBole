# Default hyper-parameters for SASRecAlignMultiViewV2
# Enhanced multi-view model with per-view L2 normalization and align scale.

n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02

# Text alignment & fusion defaults
alignment_weight: 0.0
temperature: 0.07
detach_text_emb: true
normalize_text: true
use_align: true
use_llm: false
use_cross: false
text_cross_layer_num: 3

# V2 specific defaults
multiview_align_scale: 1.0
text_view_senet_ratio: 2
per_view_l2_norm: true
