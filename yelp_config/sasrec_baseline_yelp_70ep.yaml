---
model: SASRecAlign

# Dataset (same structure as Beauty baseline, but for Yelp)
dataset: yelp
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 30
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# Training / Evaluation (55 epochs to align with two-phase total steps)
epochs: 55
train_batch_size: 1024 
eval_batch_size: 1024 
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]
metrics: [Recall, MRR, NDCG, Hit, Precision]
valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# Model hyper-parameters (aligned with SASRec default / align config)
n_layers: 2
n_heads: 2
hidden_size: 256
inner_size: 256
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
token_dropout_prob: 0.0
hidden_act: relu
layer_norm_eps: 1e-12
initializer_range: 0.02

# Text / alignment disabled
item_text_emb_path_base: ""
item_text_emb_path_llm: ""
use_llm: false
use_align: false
use_cross: false
use_seq_text_cross: false
alignment_weight: 0.0
temperature: 0.07
normalize_text: true
detach_text_emb: true
text_weight: 0.0
text_tail_threshold: 0
text_proj_norm: false
fused_item_norm: false
disable_text_feature: true
fuse_text_feature: false

# Regularization (no text-specific penalties)
weight_decay: 1e-5
label_smoothing: 0.0
cross_dropout_prob: 0.0
text_gate_init: 0.0
text_gate_reg_l2: 0.0
text_gate_reg_entropy: 0.0

# Misc
reproducibility: true
seed: 2025
device: cuda

