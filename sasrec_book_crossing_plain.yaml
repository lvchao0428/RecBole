---
# Book-Crossing 专用：原子文件无 timestamp，需与 Amazon_Beauty 配置区分。
# 文本向量生成脚本 tools/gen_text_emb_book_crossing_full_fast.sh 使用本文件。
model: SASRec_Align

hidden_size: 256

dataset: book-crossing
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating]
  item: [item_id]

epochs: 20
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: RO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'uni100','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]
metrics: [Recall, MRR, NDCG, Hit, Precision]
valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

item_text_emb_path_base: dataset/book-crossing/item_text_emb.base.npy
use_llm: false
use_cross: false
use_align: false
alignment_weight: 0.1
temperature: 0.07
detach_text_emb: true
normalize_text: true
disable_text_feature: false
text_cross_layer_num: 3
cross_dropout_prob: 0.0

text_gate_init: 0.5
text_gate_reg_l2: 0.0
text_gate_reg_entropy: 0.0

text_weight: 0.8
