---
# TF-IDF + LLM (Toys) with Higher Alignment
# 目的：修复 Toys 上 TF-IDF+LLM < TF-IDF 的层级反转问题
#
# 假设：Toys 数据集 LLM 特征需要更强的对齐信号才能发挥作用
# 配置：alignment_weight 从 0.10 提升到 0.15
#
# 理论依据：
# - Toys 数据集更大（167k items vs 67k items）
# - 更多样的商品可能需要更强的语义对齐来桥接 ID 和 Text 空间
# - 如果成功，说明 LLM 需要足够的对齐强度才能超越 TF-IDF

model: SASRecAlign
hidden_size: 256
fusion_chunk_size: 16384
n_layers: 2
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
gpu_id: "0"

dataset: Amazon_Toys_and_Games
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

epochs: 50
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

metrics: [Recall, MRR, NDCG, Hit, Precision, StratifiedRecall, StratifiedNDCG, StratifiedMRR, StratifiedHit, ItemPopularityStats]
valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# TF-IDF + LLM embeddings (Toys)
item_text_emb_path_base: /home/ubuntu/own/RecBole/dataset/Amazon_Toys_and_Games/item_text_emb.base.npy
item_text_emb_path_llm: /home/ubuntu/own/RecBole/dataset/Amazon_Toys_and_Games/item_text_emb.qwen2.5_7b.base.npy
use_llm: true
use_align: true
use_cross: true
text_cross_layer_num: 1
use_seq_text_cross: false

# 关键修改：更高的对齐权重
alignment_weight: 0.15           # 从 0.10 提升到 0.15
temperature: 0.05
detach_text_emb: true
normalize_text: true
text_weight: 1.0
text_tail_threshold: 0
text_gate_init: 0.7
text_gate_reg_l2: 0.05
text_gate_reg_entropy: 0.0

weight_decay: 1e-5
label_smoothing: 0.1
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
token_dropout_prob: 0.2
cross_dropout_prob: 0.15
cosine_score: true
cosine_scale: 10.0

text_proj_norm: true
fused_item_norm: true
disable_text_feature: false
text_mlp_bn: false
freeze_backbone: false
align_exclude_topk: 0
fuse_text_feature: true
use_fusion: false
