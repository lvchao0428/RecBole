---
# 极端配置：强制文本特征占主导
# 用于快速验证文本特征是否真的在工作

# 文本权重设置为极大值
text_weight: 10.0         # 放大10倍
text_gate_init: 5.0       # sigmoid(5) ≈ 0.993

# 确保不使用正则化
text_gate_reg_l2: 0.0
text_gate_reg_entropy: 0.0

# 关闭ID dropout，让文本更突出
hidden_dropout_prob: 0.0
attn_dropout_prob: 0.0

# 减少训练轮数便于快速测试
epochs: 10
eval_step: 1
