# Enhanced stability with item embedding LayerNorm
# This config extends stability_enhance.yaml with ID normalization

# Text fusion stability (from stability_enhance.yaml)
cross_dropout_prob: 0.2
text_gate_init: 0.3
text_gate_reg_l2: 0.01

# NEW: Enable item embedding normalization before fusion
# This ensures both ID and text paths have similar scales before DCN-V2
# Critical for preventing DCN-V2 from ignoring the text signal
fused_item_norm: true  # This enables item_emb_norm in the code

# Note: When text features are disabled (disable_text_feature: true),
# item_emb_norm will be created but not used since fusion doesn't happen

