# Early temporal window baseline (for feature rebuild + dataset split)
# Same time_based_split semantics as Main, but earlier cutoff:
#   TS [0.6, 0.1, 0.3] → global test starts ~70th percentile;
#   train/valid split within pre-test interactions.
# Corresponds to advisor 0717 "earlier rolling validation window".

model: SASRec
dataset: Amazon_Beauty
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

epochs: 50
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20

eval_args:
  group_by: user
  order: TO
  split: {'TS': [0.6, 0.1, 0.3]}
  mode:  {'valid': 'full','test':'full'}

topk: [5, 10, 20]
metrics: [Recall, MRR, NDCG, Hit, Precision]
valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null
