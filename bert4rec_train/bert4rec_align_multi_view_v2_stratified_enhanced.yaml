---
# BERT4Rec Multi-View V2 + 增强版配置
# 目标: 让Multi-View在BERT4Rec上发挥更大威力
#
# 改动点汇总:
# ============================================================
# 1. 提升基础模型能力
#    - n_layers: 2 → 3 (增加模型容量)
#    - mask_ratio: 0.2 → 0.15 (减少信息丢失)
#    - epochs: 50 → 70 (更长训练时间)
#    - train_batch_size: 256 → 512 (更稳定的梯度)
#
# 2. 增强Text特征融合
#    - text_weight: 0.8 → 1.2 (增强文本权重)
#    - multiview_align_scale: 2.0 → 3.0 (更强的对齐信号)
#    - alignment_weight: 0.05 → 0.08 (提升对齐损失权重)
#    - text_view_senet_ratio: 2 → 1 (保留最多信息)
#
# 3. 降低正则化强度
#    - hidden_dropout_prob: 0.5 → 0.3
#    - attn_dropout_prob: 0.5 → 0.3
#    - cross_dropout_prob: 0.5 → 0.3
#
# 4. 冷启动增强
#    - cold_start_align_boost: 3.0 → 5.0
# ============================================================

model: BERT4RecAlignMultiViewV2

# === 增强的模型架构 ===
hidden_size: 256
n_layers: 2                  # 从2增加到3，增强表示能力
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
mask_ratio: 0.02             # 从0.2降低到0.15，保留更多上下文信息
  #gpu_id: "4"

# Enable BERT4Rec masking transform (required for training)
transform: mask_itemseq

# Dataset / data loader
dataset: Amazon_Beauty
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# === 优化的训练参数 ===
epochs: 70                   # 从50增加到70
train_batch_size: 512        # 从256增加到512，与SASRec对齐
eval_batch_size: 512 
learning_rate: 0.0001
eval_step: 5
stopping_step: 25            # 从20增加到25
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

# 评估指标：标准指标 + 分档指标
metrics: [
  Recall, MRR, NDCG, Hit, Precision,
  StratifiedRecall, StratifiedNDCG, StratifiedMRR, StratifiedHit,
  ItemPopularityStats
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# === Multi-View 特征配置（增强版） ===
#item_text_emb_path_base: /home/ubuntu/own/RecBole/dataset/Amazon_Beauty/item_text_emb.base.npy
item_text_emb_path_base: /home/charlie/project/RecBole/dataset/Amazon_Beauty/item_text_emb.base.npy
item_text_emb_path_llm: ""
#item_text_emb_split_dir: /home/ubuntu/own/RecBole/dataset/Amazon_Beauty/qwen2.5_7b_4views
item_text_emb_split_dir: /home/charlie/project/RecBole/dataset/Amazon_Beauty/qwen2.5_7b_4views
use_llm: false
use_align: true
use_cross: true
text_cross_layer_num: 2      # 从1增加到2
use_text_view_split: true
use_multiview_text_cross: true
num_text_views: 4

# === V2 增强配置 ===
multiview_align_scale: 3.0   # 从2.0增加到3.0，更强的多视图对齐信号
text_view_senet_ratio: 1     # 从2降到1，保留最多信息（256维，无压缩）
per_view_l2_norm: true

# === 冷启动增强（更激进）===
cold_start_align_boost: 5.0  # 从3.0增加到5.0
cold_start_align_threshold: 15  # 从10增加到15

text_view_half_precision: true

# === 增强的文本融合权重 ===
alignment_weight: 0.08       # 从0.05增加到0.08
temperature: 0.05            # 从0.07降低到0.05（更sharp的对齐）
detach_text_emb: true
normalize_text: true
text_weight: 1.2             # 从0.8增加到1.2（关键！增强文本特征贡献）
text_tail_threshold: 0
text_gate_init: 0.6          # 从0.5增加到0.6
text_gate_reg_l2: 0.03       # 从0.05降低到0.03
text_gate_reg_entropy: 0.0

# === 降低正则化强度 ===
weight_decay: 5e-6           # 从1e-5降低到5e-6
label_smoothing: 0.05        # 从0.1降低到0.05
hidden_dropout_prob: 0.3     # 从0.5降低到0.3
attn_dropout_prob: 0.3       # 从0.5降低到0.3
cross_dropout_prob: 0.3      # 从0.5降低到0.3
cosine_score: true
cosine_scale: 12.0           # 从10.0增加到12.0

# Stabilizers
text_proj_norm: true
fused_item_norm: true
disable_text_feature: false
text_mlp_bn: false
freeze_backbone: false
fuse_text_feature: true

