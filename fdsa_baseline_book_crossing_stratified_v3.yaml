---
# FDSA ID-only baseline (50 epochs) + Stratified Evaluation (book-crossing)
# Uses FDSAAlignMultiViewV3 skeleton with all text/align/cross features disabled

model: FDSAAlignMultiViewV3

hidden_size: 256
n_layers: 2
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
pooling_mode: 'mean'
gpu_id: "0"
selected_features: ['book_author']

dataset: book-crossing

field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id, book_title, book_author]

epochs: 50
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

metrics: [
  Recall, MRR, NDCG, Hit, Precision,
  StratifiedRecall, StratifiedNDCG, StratifiedMRR, StratifiedHit,
  ItemPopularityStats
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

weight_decay: 1e-5
label_smoothing: 0.1

align_weight: 0.0
cold_text_boost: 0.0
infer_boost: 0.0
cold_threshold: 10

use_text_view_split: false
use_multiview_text_cross: false
item_text_emb_split_dir: ""
item_text_emb_path_base: ""
item_text_emb_path_llm: ""

use_llm: false
use_align: false
use_cross: false
text_cross_layer_num: 0
temperature: 0.07
detach_text_emb: true
normalize_text: true

text_view_senet_ratio: 2
per_view_l2_norm: true
use_text_view_senet: true
text_view_half_precision: true

cosine_score: false
cosine_scale: 10.0
text_proj_norm: false
fused_item_norm: false
text_weight: 0.0
text_gate_init: 0.0
text_mlp_bn: false
freeze_backbone: false
disable_text_feature: true
fuse_text_feature: false
cross_dropout_prob: 0.0
