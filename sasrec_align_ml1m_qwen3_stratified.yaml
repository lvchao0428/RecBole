---
# SASRec with TF-IDF + LLM (Qwen3) + Stratified Evaluation (ML-1M Dataset)

model: SASRecAlign
hidden_size: 256

# Dataset (ML-1M specific)
dataset: ml-1m
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id, movie_title, release_year, genre]

# Training / Evaluation
epochs: 200
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

# 评估指标：标准指标 + 分档指标
metrics: [
  Recall, MRR, NDCG, Hit, Precision,
  StratifiedRecall, StratifiedNDCG,
  ItemPopularityStats
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# Text features (TF-IDF + Qwen3) with SENet
item_text_emb_path_base: dataset/ml-1m/item_text_emb.base.npy
item_text_emb_path_llm: dataset/ml-1m/item_text_emb.qwen3.base.npy
use_llm: true
use_align: true
use_cross: true
text_cross_layer_num: 2
alignment_weight: 0.05
temperature: 0.07
detach_text_emb: true
normalize_text: true
use_fusion: false

# Fair comparison: Enable SENet and Gates
text_use_senet: true
num_text_views: 1

# Regularization & scoring
weight_decay: 1e-5
label_smoothing: 0.1
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
token_dropout_prob: 0.2
cosine_score: true
cosine_scale: 10.0

# Text fusion stabilizers
text_proj_norm: true
fused_item_norm: true
text_weight: 0.8
text_tail_threshold: 5
use_seq_text_cross: false
seq_text_cross_dropout: 0.1

# Switches
disable_text_feature: false
fuse_text_feature: true
cross_dropout_prob: 0.5
text_gate_init: 0.5
text_gate_reg_l2: 0.05
text_gate_reg_entropy: 0.0
text_mlp_bn: false
freeze_backbone: false
align_exclude_topk: 0

