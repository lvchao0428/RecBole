---
# SASRec Multi-View V2 - Balanced Configuration
# ============================================================
# 目标: 整体 HR 和 MRR 都提升，保持 scale law
# 策略: 适中的 text 权重 + 温和的冷启动加权 + 稳定的对齐
#
# 关键设计原则:
# 1. text_weight 不能太高，否则压制高频
# 2. cold_start_boost 适中，提升 new/few 但不过度
# 3. alignment_weight 温和，保持稳定学习
# 4. 使用 whiten（不用 center_only）
# ============================================================

model: SASRecAlignMultiViewV2
hidden_size: 256
fusion_chunk_size: 16384
n_layers: 2
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
gpu_id: "0"

# Dataset placeholder - 需要根据数据集修改
dataset: Amazon_Beauty
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id]

# Training / Evaluation
epochs: 50
train_batch_size: 512
eval_batch_size: 512
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

metrics: [
  Recall, MRR, NDCG, Hit, Precision,
  StratifiedRecall, StratifiedNDCG, StratifiedMRR, StratifiedHit,
  ItemPopularityStats
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# Text feature sources - 需要根据数据集修改路径
item_text_emb_path_base: dataset/Amazon_Beauty/item_text_emb.base.npy
item_text_emb_path_llm: ""
item_text_emb_split_dir: dataset/Amazon_Beauty/qwen2.5_7b_4views
use_llm: false
use_align: true
use_cross: true
text_cross_layer_num: 1
use_seq_text_cross: false
use_text_view_split: true
use_multiview_text_cross: true
num_text_views: 4

# ========== V2 Balanced 配置 ==========
# [核心] multiview_align_scale: 1.0 (不放大，避免过强)
multiview_align_scale: 1.0

text_view_senet_ratio: 2
per_view_l2_norm: true

# [核心] 温和的冷启动加权
# - boost=2.0: 最高 3x 权重（比 3.0 温和）
# - 效果: 提升 new/few 但不过度压制 frequent
cold_start_align_boost: 2.0
cold_start_align_threshold: 10

# 关闭 IPW（用 cold_start 替代）
use_ipw_weighting: false
# ================================

text_view_half_precision: true

# ========== 核心超参数 ==========
# [核心] alignment_weight: 0.07 (温和对齐)
# - 太高 (0.15) 会过度绑定，压制 frequent
# - 太低 (0.03) 对齐不足，text 学不好
alignment_weight: 0.07

# [核心] temperature: 0.05 (适中 InfoNCE)
temperature: 0.05

# [核心] text_weight: 0.8 (适中文本权重)
# - 太高 (1.0) 会让 text 主导，压制 ID 信号
# - 太低 (0.5) text 贡献不够
text_weight: 0.8

detach_text_emb: true
normalize_text: true
text_tail_threshold: 0
text_gate_init: 0.7
text_gate_reg_l2: 0.05
text_gate_reg_entropy: 0.0

# Regularization & scoring
weight_decay: 1e-5
label_smoothing: 0.1
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
token_dropout_prob: 0.2
cross_dropout_prob: 0.15          # 适中 dropout
cosine_score: true
cosine_scale: 10.0

# Stabilizers
text_proj_norm: true
fused_item_norm: true
disable_text_feature: false
text_mlp_bn: false
freeze_backbone: false
align_exclude_topk: 0
fuse_text_feature: true
use_fusion: false
