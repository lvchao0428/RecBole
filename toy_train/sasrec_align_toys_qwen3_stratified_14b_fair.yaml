---
# SASRec with TF-IDF + LLM (Qwen3) + Stratified Evaluation (Toys Dataset)
# 与 Multi-View V2 14B 公平对比的配置
# 
# 对齐项（与 sasrec_align_multi_view_v2_toys_stratified_14b.yaml 保持一致）：
# - text_weight: 1.0 (vs 0.8)
# - text_gate_init: 0.7 (vs 0.5)
# - text_gate_reg_l2: 0.01 (vs 0.05)
# - SENet 无压缩 (通过 num_text_views=1 实现)
# - 冷启动配置相同

model: SASRecAlign
hidden_size: 256
n_layers: 2
n_heads: 2
inner_size: 256
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02
  #gpu_id: "5"

# Dataset (Amazon_Toys_and_Games specific)
dataset: Amazon_Toys_and_Games
field_separator: "\t"
seq_separator: " "
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
LABEL_FIELD: label
NEG_PREFIX: neg_
RATING_FIELD: rating
TIME_FIELD: timestamp
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
load_col:
  inter: [user_id, item_id, rating, timestamp]
  item: [item_id, title, categories]

# Training / Evaluation
epochs: 50
train_batch_size: 512 
eval_batch_size: 512 
learning_rate: 0.0001
eval_step: 5
stopping_step: 20
clip_grad_norm: { max_norm: 5 }
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode:  {'valid': 'full','test':'full'}
eval_neg_sample_args: {'distribution': 'uniform', 'sample_num': 100}
topk: [5, 10, 20]

# 评估指标：标准指标 + 分档指标
metrics: [
  Recall, MRR, NDCG, Hit, Precision,           # 标准指标
  StratifiedRecall, StratifiedNDCG, StratifiedMRR, StratifiedHit,  # 分档指标
  ItemPopularityStats                            # Item 分布统计
]

valid_metric: MRR@10
loss_type: CE
train_neg_sample_args: null

# Text features (TF-IDF + Qwen2.5-14B) with SENet
# 注意: LLM路径使用14B版本以公平对比
#item_text_emb_path_base: /home/ubuntu/own/RecBole/dataset/Amazon_Toys_and_Games/item_text_emb.base.npy
item_text_emb_path_base: /home/charlie/project/RecBole/dataset/Amazon_Toys_and_Games/item_text_emb.base.npy
  #item_text_emb_path_llm: /home/ubuntu/own/RecBole/dataset/Amazon_Toys_and_Games/item_text_emb.qwen2.5_14b.base.npy
item_text_emb_path_llm: /home/charlie/project/RecBole/dataset/Amazon_Toys_and_Games/item_text_emb.qwen2.5_7b.base.npy
use_llm: true
use_align: true
use_cross: true
text_cross_layer_num: 1
alignment_weight: 0.05
temperature: 0.07
detach_text_emb: true
normalize_text: true
use_fusion: false

# ========== 与 14B MultiView 对齐的配置 ==========
# [对齐-1] SENet 配置
# MultiView 14B 使用 text_view_senet_ratio=1 (无压缩)
# 对于单一 LLM view，我们也启用 SENet
text_use_senet: true
num_text_views: 1

# [对齐-2] 文本权重和门控初始化
# MultiView 14B: text_weight=1.0, text_gate_init=0.7
text_weight: 1.0
text_gate_init: 0.7

# [对齐-3] 正则化强度
# MultiView 14B: text_gate_reg_l2=0.01 (更弱的正则化)
text_gate_reg_l2: 0.01
text_gate_reg_entropy: 0.0
# ================================

# Regularization & scoring (与14B保持一致)
weight_decay: 1e-5
label_smoothing: 0.1
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
token_dropout_prob: 0.2
cross_dropout_prob: 0.5
cosine_score: true
cosine_scale: 10.0

# Text fusion stabilizers
text_proj_norm: true
fused_item_norm: true
text_tail_threshold: 0
use_seq_text_cross: false
seq_text_cross_dropout: 0.1

# Switches
disable_text_feature: false
fuse_text_feature: true
text_mlp_bn: false
freeze_backbone: false
align_exclude_topk: 0

# ========== 冷启动对齐权重增强 (与14B保持一致) ==========
cold_start_align_boost: 3.0
cold_start_align_threshold: 10
# ================================

